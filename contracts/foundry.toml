[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
solc = "0.8.30"
evm_version = "prague"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"
cbor_metadata = false
fs_permissions = [{ access = "read", path = "../vectors" }]

[fuzz]
runs = 1000

[profile.default.lint]
lint_on_build = false
